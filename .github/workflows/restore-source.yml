name: Restore source files

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-source.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and restore source files
        run: |
          set -e
          curl -fsSL -o index.html "https://litter.catbox.moe/c43q0b.html"
          curl -fsSL -o main.js "https://litter.catbox.moe/tlqthg.js"
          curl -fsSL -o style.css "https://litter.catbox.moe/iewgp9.css"
          curl -fsSL -o sw.js "https://litter.catbox.moe/omp212.js"
          curl -fsSL -o ios/PipeDesk/Info.plist "https://litter.catbox.moe/2avowd.plist"
          wc -c index.html main.js style.css sw.js
          grep -q 'scanCccdQrBtn' index.html
          grep -q 'parseCccdQrText' main.js
          mkdir -p ios/PipeDesk/www
          cp index.html main.js style.css sw.js ios/PipeDesk/www/
          # Keep other www assets
          cp -n demo-seed.js ios/PipeDesk/www/ 2>/dev/null || true
          cp -n manifest.webmanifest ios/PipeDesk/www/ 2>/dev/null || true
          cp -rn data icons ios/PipeDesk/www/ 2>/dev/null || true
      - name: Commit restored files
        run: |
          git config user.name "CRM D7 Bot"
          git config user.email "bot@crmd7.local"
          git add index.html main.js style.css sw.js ios/PipeDesk/Info.plist ios/PipeDesk/www/
          git status
          git commit -m "CRM D7 v1.6.8 — restore full source + QR CCCD scan" || echo "no changes"
          git push origin HEAD:main
